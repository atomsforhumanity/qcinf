[project]
name = "qcinf"
version = "0.5.1"
description = "Cheminformatics algorithms and structure utilities using standardized qcdata data structures."
readme = "README.md"
authors = [{ name = "Colton Hicks", email = "github@coltonhicks.com" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic~=2.0,!=2.0.1,!=2.1.0",
    "qcdata>=0.17.0",
    "typing-extensions>=4.12.2",
    "numpy>=1.24.0",
    "sympy>=1.14.0",
    "pynauty>=2.8.8.1",
    "rustworkx>=0.17.1",
    "qcref>=0.3.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/atomsforhumanity/qcinf"
Source = "https://github.com/atomsforhumanity/qcinf"
Changelog = "https://github.com/atomsforhumanity/qcinf/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/atomsforhumanity/qcinf/issues"
repository = "https://github.com/atomsforhumanity/qcinf"


[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    # No Python 3.15 wheels yet; its tests skip without it.
    "openbabel-wheel>=3.1.1.21; python_version < '3.15'",
    "rdkit>=2024.9.6",
    "types-toml>=0.10.8.20240310",
    "numba>=0.57.0",
    "pre-commit>=4.0",
    "pre-commit-hooks>=5.0",
    "detect-secrets>=1.5",
    "typos>=1.30",
]

[project.optional-dependencies]
fast = ["numba>=0.57.0"]
openbabel = ["openbabel-wheel>=3.1.1.21"]
rdkit = ["rdkit>=2024.9.6"]
all = ["openbabel-wheel>=3.1.1.21", "rdkit>=2024.9.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["E501"] # line length is the formatter's job

[tool.ruff.lint.isort]
known-first-party = ["qcinf", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"docs/**" = ["D"]
"examples/**" = ["D"]
"build_tools/**" = ["D"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
filterwarnings = [
    # silence RDKit-SWIG “no __module__ attribute” deprecation notices
    "ignore:builtin type SwigPy.*has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink.*has no __module__ attribute:DeprecationWarning",
]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["qcinf"]

[tool.coverage.report]
show_missing = true
